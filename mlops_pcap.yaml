project_name: "network-ids-demo"
framework: "sklearn"
task_type: "classification"
entry_point: "ml/train.py"
predict_module: "ml/predict.py"
target_column: "label"

# -- Dataset (PCAP directory) -------------------------------------------------
dataset_path: "data/pcaps/"
dataset_type: "pcap_dir"          # tells AutoMLOps to use the PCAP extractor

# Files in data/pcaps/ whose name contains 'benign' get label 0,
# files containing 'attack' get label 1.
pcap_label_map:
  "benign": 0
  "attack": 1

# -- Features (auto-inferred from PCAP extractor if left empty) ---------------
# Leave blank to auto-detect all 24 PCAP flow features, or list a subset:
numerical_features:
  - "duration_sec"
  - "total_packets"
  - "total_bytes"
  - "mean_pkt_size"
  - "std_pkt_size"
  - "mean_iat_sec"
  - "std_iat_sec"
  - "pct_tcp"
  - "pct_udp"
  - "pct_icmp"
  - "syn_count"
  - "ack_count"
  - "fin_count"
  - "rst_count"
categorical_features: []

# -- Quality gate -------------------------------------------------------------
metrics_threshold:
  accuracy: 0.80
  precision: 0.75

dependencies: "requirements.txt"
